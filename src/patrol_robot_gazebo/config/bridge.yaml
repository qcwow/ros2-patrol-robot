- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  # 仿真运行时间较长或 CPU 短时繁忙时，只转发最新时钟。
  # 旧时钟排队会让后续传感器消息落到 TF 缓存时间范围之外。
  subscriber_queue: 1
  publisher_queue: 1
  qos_profile: CLOCK

- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
  # 速度指令不能排队执行，否则车辆恢复后会重放过期控制量。
  subscriber_queue: 1
  publisher_queue: 1

