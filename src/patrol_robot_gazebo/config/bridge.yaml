- ros_topic_name: /scan
  gz_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  # Nav2 只需要最新一帧扫描。限制两侧队列可避免旧扫描在数秒后
  # 才进入 costmap，触发 "timestamp earlier than TF cache"。
  subscriber_queue: 1
  publisher_queue: 1
  qos_profile: SENSOR_DATA

