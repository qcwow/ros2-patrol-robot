rgbd_processor:
  ros__parameters:
    # 输入必须是已经对齐到深度相机坐标系的彩色图和深度图。
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_rect_raw
    camera_info_topic: /camera/depth/camera_info
    point_cloud_topic: /camera/points/filtered
    use_color: true

    # 16UC1 深度图通常以毫米为单位；32FC1 按 ROS 约定已是米。
    depth_scale: 0.001
    min_depth: 0.25
    max_depth: 8.0

    # 先隔像素采样，再做体素降采样，控制车载计算量和网络带宽。
    # 导航避障不需要逐像素点云。四倍采样让投影像素数降为原来的
    # 1/16，避免 RGB-D 处理抢占雷达、TF 和控制循环的计算时间。
    sampling_stride: 4
    voxel_size: 0.05
    max_points: 30000

    # 队列只用于轻微对齐，不允许积累旧图像。桥接端同样只保留最新帧。
    sync_queue_size: 3
    sync_slop_seconds: 0.05
