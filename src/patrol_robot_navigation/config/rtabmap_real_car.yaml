rtabmap:
  ros__parameters:
    use_sim_time: false
    frame_id: base_footprint
    map_frame_id: map
    odom_frame_id: odom
    publish_tf: true
    subscribe_rgbd: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: true
    approx_sync: true
    approx_sync_max_interval: 0.10
    topic_queue_size: 10
    sync_queue_size: 20
    qos_image: 2
    qos_camera_info: 2
    qos_scan: 2
    qos_odom: 2
    wait_for_transform: 0.30
    map_always_update: true
    map_empty_ray_tracing: true
    map_cleanup: true
    cloud_output_voxelized: true
    cloud_subtract_filtering: true
    cloud_subtract_filtering_min_neighbors: 2
    latch: true

    # RTAB-Map algorithm parameters are strings. The official RGB-D + scan
    # profile uses ICP registration; RGB-D remains available for appearance
    # loop detection and 3D reconstruction, with chassis odometry on /odom.
    "Reg/Strategy": "1"
    "Reg/Force3DoF": "true"
    # The previous 1 Hz default made the web map visibly step even though a
    # frame normally took well under 0.2 s on the Orin.  The optional local
    # voxel preview is now disabled, leaving headroom for a 2 Hz graph update.
    "Rtabmap/DetectionRate": "2"
    "RGBD/NeighborLinkRefining": "true"
    "RGBD/OptimizeFromGraphEnd": "false"
    "RGBD/LinearUpdate": "0.08"
    "RGBD/AngularUpdate": "0.10"
    "RGBD/CreateOccupancyGrid": "true"
    "Mem/IncrementalMemory": "true"
    "Optimizer/GravitySigma": "0"

    # Keep 3D local grids for /rtabmap/cloud_map and OctoMap. RTAB-Map also
    # projects these grids into the Nav2-compatible 2D /map.
    "Grid/Sensor": "2"
    "Grid/3D": "true"
    "Grid/FromDepth": "true"
    "Grid/RayTracing": "true"
    "Grid/NormalsSegmentation": "false"
    "Grid/RangeMin": "0.20"
    "Grid/RangeMax": "3.00"
    "Grid/CellSize": "0.05"
    "Grid/DepthDecimation": "4"
    "Grid/FootprintLength": "0.31"
    "Grid/FootprintWidth": "0.26"
    "Grid/FootprintHeight": "0.35"
    "Grid/MaxGroundHeight": "0.06"
    "Grid/MaxObstacleHeight": "1.50"
    "Grid/NoiseFilteringRadius": "0.08"
    "Grid/NoiseFilteringMinNeighbors": "3"
