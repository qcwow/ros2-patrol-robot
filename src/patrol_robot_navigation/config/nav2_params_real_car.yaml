amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.12
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.15
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_raw
    # Wait for an operator-confirmed RViz pose; never assume map origin.
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [transit_goal_checker, precise_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 15.0
    transit_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
    precise_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.25
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.70
      regulated_linear_scaling_min_speed: 0.03
      cost_scaling_dist: 0.25
      cost_scaling_gain: 0.8
      inflation_cost_scaling_factor: 3.0
      # Frontier mapping should follow a curved path instead of repeatedly
      # issuing in-place heading rotations. A real odometry sign/scale fault
      # must still be diagnosed before the wheels are placed on the ground.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.65
      max_angular_accel: 0.5
      allow_reversing: false
      max_robot_pose_search_dist: 1.5
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.03
      transform_tolerance: 0.5
      footprint: "[[0.16, 0.13], [0.16, -0.13], [-0.15, -0.13], [-0.15, 0.13]]"
      footprint_padding: 0.01
      plugins: [lidar_obstacle_layer, camera_obstacle_layer, inflation_layer]
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      camera_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: camera_cloud
        camera_cloud:
          # Ground and sparse depth outliers are removed before Nav2 sees it.
          topic: /camera/obstacles
          data_type: PointCloud2
          min_obstacle_height: 0.06
          max_obstacle_height: 1.50
          clearing: true
          marking: true
          observation_persistence: 0.25
          expected_update_rate: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.20
          obstacle_max_range: 2.5
          obstacle_min_range: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[0.16, 0.13], [0.16, -0.13], [-0.15, -0.13], [-0.15, 0.13]]"
      footprint_padding: 0.01
      track_unknown_space: true
      # RGB-D obstacles stay local so a transient depth artefact cannot become
      # a persistent global blockage. The static map and lidar remain global.
      plugins: [static_layer, lidar_obstacle_layer, failed_path_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      failed_path_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: failed_paths
        failed_paths:
          topic: /patrol_manager/failed_path_points
          sensor_frame: map
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          obstacle_min_range: 0.0
          obstacle_max_range: 100.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # The first physical obstacle-detour run on 2026-08-05 showed that a
        # 0.30 m / 3.0 global inflation field allowed NavFn to choose a route
        # that the local controller later rejected as a collision. Keep the
        # measured footprint unchanged and make planning conservative enough
        # to reject or route farther around the obstacle before motion starts.
        cost_scaling_factor: 2.5
        inflation_radius: 0.40
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Humble's behavior_server rejects an empty plugin list. Keep only the
    # non-motion wait behavior during initial physical tests: no autonomous
    # spin, back-up, or drive-on-heading recovery is available.
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    local_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.0, 0.45]
    min_velocity: [-0.05, 0.0, -0.45]
    max_accel: [0.25, 0.0, 0.5]
    max_decel: [-0.35, 0.0, -0.7]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
