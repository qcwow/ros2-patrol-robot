amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.08
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    # Simulation publishes a deterministic map->odom transform from ground
    # truth. AMCL remains available for particle diagnostics but must not
    # compete for the same TF, otherwise RViz and the controller will jitter.
    tf_broadcast: false
    transform_tolerance: 0.5
    update_min_a: 0.15
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: -6.0
      y: -4.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # VMware 中的软件渲染和 Python 仿真会偶发占用调度时间。
    # 20 ms 的 Nav2 默认值过紧，会把正常的规划确认误判为超时。
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: true
    # Jazzy 的 Gazebo 驱动和 velocity_smoother 使用 geometry_msgs/Twist。
    # 显式固定类型，避免不同 Nav2 版本默认切换为 TwistStamped 后路线存在但底盘收不到速度。
    enable_stamped_cmd_vel: false
    # TurtleBot3 Jazzy also uses 10 Hz. RGB-D is no longer part of the default
    # base-navigation costmap, so this rate remains responsive without making
    # point-cloud projection part of the controller's critical path.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # A single delayed scan or a tight turn must not abort FollowPath in 0.3 s.
    # Keep publishing a safe zero command briefly, then enter BT recovery if
    # the collision prediction remains valid.
    failure_tolerance: 1.5
    progress_checker_plugins: [progress_checker]
    # The patrol manager selects a profile before each NavigateToPose goal.
    # Transit nodes remain fluid while equipment and home poses use the
    # tighter profile required for repeatable inspection framing.
    goal_checker_plugins: [transit_goal_checker, precise_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false

    progress_checker:
      # Count in-place heading correction as real progress. The former simple
      # checker observed translation only and aborted while RPP was rotating.
      plugin: nav2_controller::PoseProgressChecker
      # The checker must be finer than the 6-8 cm inspection tolerance;
      # otherwise legitimate centimetre-scale settling is misclassified as a
      # stall just before SimpleGoalChecker accepts the pose.
      required_movement_radius: 0.03
      required_movement_angle: 0.05
      # 真正卡住时尽快进入清图和失败后重规划；正常原地转向会由
      # required_movement_angle 持续刷新进度，不会被误判。
      movement_time_allowance: 15.0
    transit_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
    precise_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.10
    FollowPath:
      # NavFn produces a geometric path whose first heading can differ
      # greatly from the robot heading. The shim owns that initial rotation
      # and uses separate engage/disengage thresholds, preventing the raw RPP
      # controller from alternating left/right around the hand-off angle.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      angular_dist_threshold: 0.55
      # Jazzy 支持独立的退出阈值。原先 0.12 rad 对带延迟的仿真里程计
      # 过于苛刻，车辆会越过目标角后反向修正，始终无法交还给 RPP。
      angular_disengage_threshold: 0.20
      forward_sampling_distance: 0.45
      rotate_to_heading_angular_vel: 0.32
      max_angular_accel: 0.8
      simulate_ahead_time: 0.8
      rotate_to_goal_heading: true
      # 旋转加速度使用上一周期命令估算；底层 velocity_smoother 仍负责
      # 20 Hz 速度斜坡，避免低频/延迟里程计造成正负方向反复追逐。
      closed_loop: false
      use_path_orientations: false
      # 化工设备区优先保证拐角跟踪与制动距离，不追求直线路段峰值速度。
      desired_linear_vel: 0.32
      # 前视点不得落在 0.58 m 长的车体内部；同时限制最大前视距离，
      # 避免在直角弯提前追逐弯后路径并切入内角。
      lookahead_dist: 0.40
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.45
      lookahead_time: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      # Slow enough to settle inside a 6-8 cm goal window without repeatedly
      # crossing it. The speed limit topic still caps the overall waypoint
      # velocity, and the base watchdog remains the final safety boundary.
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.65
      use_collision_detection: true
      # At 0.32 m/s this checks roughly 0.16 m beyond the current footprint.
      # A long arc over-reports collisions before valid turns in narrow aisles.
      max_allowed_time_to_collision_up_to_carrot: 0.50
      use_regulated_linear_velocity_scaling: true
      # 膨胀区已经收窄并加快衰减，因此重新启用近障减速：窄通道仍可通行，
      # 但接近设备和墙角时会在碰撞检测介入前先降低线速度。
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.06
      cost_scaling_dist: 0.38
      cost_scaling_gain: 0.75
      inflation_cost_scaling_factor: 5.0
      # RotationShim 处理新路径的初始对齐；RPP 还必须处理路径中间的尖角。
      # 当弯后路径与车头相差较大时先原地对齐，再继续前进，避免用圆弧切内弯。
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.65
      allow_reversing: false
      # Search only the nearby integrated portion of the path. A 10 m search
      # could select a later segment of a looping route that passed close to
      # the robot, flipping the desired heading on every control cycle.
      max_robot_pose_search_dist: 1.5
      use_interpolation: true
      interpolate_curvature_after_goal: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # 代价地图不必与控制器同频重算；速度平滑器仍以 20 Hz 连续输出。
      update_frequency: 6.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # 6 m 窗口确保转弯和恢复时仍有足够路径供 RPP 选择前视点和检查碰撞。
      width: 6
      height: 6
      resolution: 0.05
      # 给 TF/传感器线程一次短暂调度余量；真正过期的数据仍由消息过滤器丢弃。
      transform_tolerance: 0.5
      footprint: "[[0.29, 0.23], [0.29, -0.23], [-0.29, -0.23], [-0.29, 0.23]]"
      # 轮廓本身已经比 0.52 x 0.42 m 实体底盘宽；再保留 1 cm 动态余量。
      # 膨胀层只负责路线偏好，不能代替轮廓碰撞检查。
      footprint_padding: 0.01
      plugins: [lidar_obstacle_layer, camera_obstacle_layer, inflation_layer]
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          # Gazebo 对未命中的光束会返回 inf；必须将其用于清除历史障碍，
          # 否则转弯后残留点会在车前形成一堵虚假的墙。
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.08
          obstacle_max_range: 6.0
          obstacle_min_range: 0.08
      camera_obstacle_layer:
        # RGB-D 点云按高度过滤后直接投影到 2D 障碍层，不维护 3D 体素网格。
        # 这保留视觉避障能力，同时显著减少无显卡工控机的投影和内存开销。
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: camera_cloud
        camera_cloud:
          topic: /camera/points/filtered
          data_type: PointCloud2
          transport_type: raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          obstacle_min_range: 0.25
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 车体外接半径约 0.37 m；0.40 m 留下一条较薄的路线偏好带，
        # 让窄通道更容易通行。较大的 scaling factor 使代价快速衰减。
        cost_scaling_factor: 5.0
        inflation_radius: 0.40
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[0.29, 0.23], [0.29, -0.23], [-0.29, -0.23], [-0.29, 0.23]]"
      footprint_padding: 0.01
      track_unknown_space: true
      # 全局规划只使用已审核的静态地图。实时雷达/相机障碍只进入局部
      # 代价地图，使车辆在原路减速停车，而不是在化工区自行规划绕行。
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.40
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    # 此参数只用于规划耗时告警，不控制重规划频率。实际行为树在每个
    # NavigateToPose 开始时规划一次，只有 FollowPath 失败后才重新规划。
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      # NavFn/Dijkstra 是无运动学约束的轻量 2D 全局规划器；尖角朝向
      # 由 RotationShim + RPP 处理，不需要高算力轨迹优化器。
      plugin: nav2_navfn_planner::NavfnPlanner
      # Do not silently move an inspection goal to a distant free cell. One
      # map cell is enough for discretization; invalid goals must fail visibly.
      tolerance: 0.05
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.25
    rotational_acc_lim: 1.8

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    # Nav2 and TurtleBot3 use OPEN_LOOP by default. It prevents delayed or
    # driver-specific odometry signs from feeding back into the command ramp and
    # suppressing an otherwise valid controller command.
    feedback: OPEN_LOOP
    max_velocity: [1.5, 0.0, 0.45]
    min_velocity: [-0.20, 0.0, -0.45]
    max_accel: [0.8, 0.0, 0.8]
    max_decel: [-0.8, 0.0, -0.8]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
