amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.08
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    # Simulation publishes a deterministic map->odom transform from ground
    # truth. AMCL remains available for particle diagnostics but must not
    # compete for the same TF, otherwise RViz and the controller will jitter.
    tf_broadcast: false
    transform_tolerance: 0.5
    update_min_a: 0.15
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: -6.0
      y: -4.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # VMware 中的软件渲染和 Python 仿真会偶发占用调度时间。
    # 20 ms 的 Nav2 默认值过紧，会把正常的规划确认误判为超时。
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: true
    # The RGB-D simulator and Gazebo share CPU with Nav2. Ten control updates
    # per second are sufficient for a 0.55 m/s indoor robot and remain stable
    # on virtualized hosts.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false

    progress_checker:
      # Count in-place heading correction as real progress. The former simple
      # checker observed translation only and aborted while RPP was rotating.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.12
      movement_time_allowance: 30.0
    goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # 预制地图分辨率为 0.5 m；0.18 m 容差会让机器人在栅格边界反复修正。
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.55
      lookahead_dist: 0.55
      min_lookahead_dist: 0.28
      max_lookahead_dist: 0.85
      lookahead_time: 1.4
      rotate_to_heading_angular_vel: 0.55
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.65
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.85
      regulated_linear_scaling_min_speed: 0.12
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.2
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.65
      max_angular_accel: 1.8
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # 6 m 窗口确保转弯和恢复时仍有足够的全局路径点可供 DWB 评分。
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.29, 0.23], [0.29, -0.23], [-0.29, -0.23], [-0.29, 0.23]]"
      plugins: [lidar_obstacle_layer, camera_voxel_layer, inflation_layer]
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          # Gazebo 对未命中的光束会返回 inf；必须将其用于清除历史障碍，
          # 否则转弯后残留点会在车前形成一堵虚假的墙。
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.08
          obstacle_max_range: 6.0
          obstacle_min_range: 0.08
      camera_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 1
        combination_method: 1
        observation_sources: camera_cloud
        camera_cloud:
          topic: /camera/points/filtered
          data_type: PointCloud2
          transport_type: raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          obstacle_min_range: 0.25
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.2
        inflation_radius: 0.48
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: "[[0.29, 0.23], [0.29, -0.23], [-0.29, -0.23], [-0.29, 0.23]]"
      track_unknown_space: true
      plugins: [static_layer, lidar_obstacle_layer, camera_voxel_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.08
          obstacle_max_range: 6.0
          obstacle_min_range: 0.08
      camera_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        # Camera points remain in the local collision map. Keeping thousands
        # of RGB-D points in the global map caused needless full-route updates;
        # the 360-degree lidar still marks global dynamic obstacles.
        enabled: false
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 1
        combination_method: 1
        observation_sources: camera_cloud
        camera_cloud:
          topic: /camera/points/filtered
          data_type: PointCloud2
          transport_type: raw
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          obstacle_min_range: 0.25
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.2
        inflation_radius: 0.48
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.35
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.25
    rotational_acc_lim: 1.8

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.5, 0.0, 0.8]
    min_velocity: [-0.20, 0.0, -0.8]
    max_accel: [0.8, 0.0, 1.8]
    max_decel: [-0.8, 0.0, -1.8]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
